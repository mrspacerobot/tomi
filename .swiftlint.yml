# Size and clarity limits from AGENTS.md. Formatting itself belongs to swift-format.
included:
  - Tomi
  - TomiTests
  - TomiUITests
  - Packages/TomiCore/Sources
  - Packages/TomiCore/Tests

disabled_rules:
  - trailing_comma
  - opening_brace
  - todo

opt_in_rules:
  - closure_body_length
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - first_where
  - empty_count
  - file_name

function_body_length:
  warning: 10
closure_body_length:
  warning: 10
type_body_length:
  warning: 80
file_length:
  warning: 150
  ignore_comment_only_lines: true
function_parameter_count:
  warning: 3
cyclomatic_complexity:
  warning: 5
  ignores_case_statements: true
nesting:
  type_level: 1
  function_level: 2
line_length:
  warning: 120
large_tuple:
  warning: 2
identifier_name:
  min_length: 2
# "Mastered" is Tomi's word for a skill with every level complete, so code may say it. Other uses stay banned.
inclusive_language:
  override_allowed_terms:
    - mastercard
    - mastered
    - mastery

custom_rules:
  hard_coded_text:
    name: "Hard-coded text"
    included: "Tomi/.*\\.swift"
    regex: '\b(Text|Button|Label|Toggle|Picker|Section|TextField|SecureField|Link|Menu|navigationTitle|accessibilityLabel|accessibilityHint|accessibilityValue|alert|confirmationDialog)\(\s*"|String\(localized:\s*"'
    message: "Put user-facing text in Localizable.xcstrings and use its generated symbol."
    severity: error
  no_ambient_clock:
    name: "No ambient clock, calendar or locale in the rules package"
    included: "Packages/TomiCore/Sources/.*\\.swift"
    regex: '\b(Calendar|Locale|TimeZone)\.(current|autoupdatingCurrent)\b|\bDate\(\)|\bDate\.now\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Take the calendar, locale and the moment as parameters, so the rule gives the same answer in a test."
    severity: error
  raw_colour:
    name: "Raw colour outside the design system"
    included: "Tomi/.*\\.swift"
    excluded: "Tomi/DesignSystem/.*\\.swift"
    regex: '\b(UIColor|CGColor)\b|#colorLiteral|\bColor\(\s*(\.sRGB|\.displayP3|red:|hue:|white:|"|\.)|(\bColor|[(,:]\s*)\.(red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|primary|secondary|accentColor)\b'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Use a colour role of Tomi/DesignSystem (ColorRole). If one is missing, add it there, in light and dark."
    severity: error
  raw_font:
    name: "Raw font outside the design system"
    included: "Tomi/.*\\.swift"
    excluded: "Tomi/DesignSystem/.*\\.swift"
    regex: '\.font\(|\bFont\.|\bUIFont\b|\.fontWeight\(|\.fontDesign\('
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Use a text style of Tomi/DesignSystem (textStyle). If one is missing, add it there."
    severity: error
  raw_spacing:
    name: "Raw spacing, radius or line weight outside the design system"
    included: "Tomi/.*\\.swift"
    excluded: "Tomi/DesignSystem/.*\\.swift"
    regex: '\.(padding|safeAreaPadding|contentMargins|offset)\([^)\n]*\d|\b(spacing|cornerRadius|cornerSize|lineWidth|lineSpacing|minLength):\s*-?\d'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Use Spacing, Radius or RuleWeight of Tomi/DesignSystem. If a value is missing, add it there."
    severity: error
  no_print:
    name: "No print"
    included: "(Tomi|Packages/TomiCore/Sources)/.*\\.swift"
    regex: '\bprint\('
    message: "Use Logger, and never log photos, ingredients or chat text."
    severity: error
